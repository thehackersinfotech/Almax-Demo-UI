# Tenant subdomains ({slug}.almax.hackersinfotech.com, {slug}.localhost) go
# straight to the app login; only the bare domain shows the landing page.
map $host $is_tenant_host {
    default                                        0;
    ~^(?!www\.)[^.]+\.almax\.hackersinfotech\.com$   1;
    ~^[^.]+\.localhost$                            1;
}

server {
    listen 3000;
    server_name _;

    # HAProxy terminates TLS on :443 and proxies here as HTTP :3000.
    # Nginx's default directory-slash redirect for /bms → /bms/ would
    # otherwise emit Location: http://host:3000/bms/ (HSTS then upgrades
    # that to https://host:3000/bms/). Relative redirects keep the public URL.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    
    # Docker's embedded DNS. Resolving via a variable (instead of a bare
    # proxy_pass host) defers lookup to request time, so nginx doesn't
    # refuse to start if the backend container isn't resolvable yet.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8000;

    # Public landing page (built from ./landing into the web root).
    location = / {
        if ($is_tenant_host) {
            return 302 /bms/login;
        }
        try_files /index.html =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /login {
        return 301 /bms/login;
    }

    location = /bms {
        return 301 /bms/;
    }

    location /bms/api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bms/media/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bms/ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /bms/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /bms/ {
        try_files $uri $uri/ /bms/index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok";
    }
}
